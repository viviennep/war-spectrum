[build-system]
requires = ['setuptools>=69', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'war-spectrum'
version = '0.1.0'
description = 'Data scrapers, preprocessing tools, and models for WAR spectrum site'
requires-python = '>=3.10'
dependencies = [
    'numpy',
    'pandas',
    'polars',
    'pyarrow',
    'streamlit-aggrid',
    #'scikit-learn',     
    #'catboost',        # comment these for the sake of streamlit boot speed
    #'torch',
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

